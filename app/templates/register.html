<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - InternFlow</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="form-container">

        <h1>Create Student Account</h1>

        <p>Register for InternFlow</p>

        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <input
                type="text"
                name="student_id"
                placeholder="Student ID"
                required
            >

            <input
                type="text"
                name="department"
                placeholder="Department"
                required
            >

            <input
                type="number"
                name="year"
                placeholder="Year"
                min="1"
                max="8"
                required
            >

            <input
                type="text"
                name="phone"
                placeholder="Phone Number"
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p>
            Already have an account?
            <a href="#">Login</a>
        </p>

    </div>

</body>
</html>
