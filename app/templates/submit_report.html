<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Submit Progress Report - InternFlow</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            InternFlow
        </div>

        <div class="nav-links">

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        </div>

    </nav>


    <div class="form-container">

        <h1>
            Submit Progress Report
        </h1>

        <p>
            Submit an update about your internship progress.
        </p>


        <form
            method="POST"
            action="{{ url_for('submit_report', application_id=application['id']) }}"
        >

            <label for="title">
                Report Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Example: Week 1 Progress Report"
                required
            >


            <label for="content">
                Report Content
            </label>

            <textarea
                id="content"
                name="content"
                rows="10"
                placeholder="Describe what you worked on, what you learned, and any challenges you faced."
                required
            ></textarea>


            <button type="submit">
                Submit Report
            </button>

        </form>

    </div>

</body>

</html>
